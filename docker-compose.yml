version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-quote-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - insurance-network
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: insurance-quote-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: insurance_quotes
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: laravel
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - insurance-network
    ports:
      - "3306:3306"

  nginx:
    image: nginx:alpine
    container_name: insurance-quote-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - insurance-network
    depends_on:
      - app

networks:
  insurance-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
